# Use Python 3.9 and pip/setuptools from Nix
[phases.setup]
  nixPkgs = ["python39", "python39Packages.pip", "python39Packages.setuptools", "postgresql"]  # Install Python 3.9 with pip and setuptools
  nixLibs = ["postgresql"]  # Ensure PostgreSQL libraries are available for psycopg2-binary

# Create a virtual environment and install dependencies
[phases.install]
  cmds = [
    "python3.9 -m venv /opt/venv",  # Create a virtual environment
    "/opt/venv/bin/pip install --upgrade pip setuptools",  # Upgrade pip and setuptools in the virtual environment
    "/opt/venv/bin/pip install -r requirements.txt"  # Install dependencies
  ]

# Activate the virtual environment and start the app with gunicorn
[start]
  cmd = "source /opt/venv/bin/activate && gunicorn -b 0.0.0.0:$PORT app:app"