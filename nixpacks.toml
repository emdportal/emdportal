# Use Python 3.9 as the base environment
[phases.setup]
  nixPkgs = ["python39", "postgresql"]  # Install Python 3.9 and PostgreSQL client
  nixLibs = ["postgresql"]  # Ensure PostgreSQL libraries are available for psycopg2-binary

# Install pip and set up a virtual environment
[phases.install]
  cmds = [
    "python3.9 -m ensurepip --upgrade",  # Ensure pip is installed
    "python3.9 -m pip install --upgrade pip",  # Upgrade pip
    "python3.9 -m venv /opt/venv",  # Create a virtual environment
    "/opt/venv/bin/pip install -r requirements.txt"  # Install dependencies in the virtual environment
  ]

# Activate the virtual environment and start the app with gunicorn
[start]
  cmd = "source /opt/venv/bin/activate && gunicorn -b 0.0.0.0:$PORT app:app"