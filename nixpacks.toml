# Use Python 3.9 and pip/setuptools from Nix, with enhanced runtime libraries
[phases.setup]
  nixPkgs = ["python39", "python39Packages.pip", "python39Packages.setuptools", "postgresql", "stdenv.cc.cc.lib", "glibc", "libgomp"]
  nixLibs = ["postgresql"]

# Create a virtual environment and install dependencies
[phases.install]
  cmds = [
    "python3.9 -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip setuptools",
    "/opt/venv/bin/pip install numpy==1.24.0 pandas==1.5.3 scipy==1.10.1",
    "/opt/venv/bin/pip install -r requirements.txt"
  ]

# Activate the virtual environment and start the app with gunicorn
[start]
  cmd = "source /opt/venv/bin/activate && gunicorn -b 0.0.0.0:$PORT app:app"