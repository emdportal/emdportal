<div id="battery_container">
    {% if general %}
        {% for battery in general.battery_banks %}
            <div class="dynamic-field">
                <div class="mb-3">
                    <label class="form-label">Make of Battery</label>
                    <input type="text" class="form-control" name="make_of_battery[]" value="{{ battery.make_of_battery }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Battery Capacity</label>
                    <input type="number" step="any" class="form-control" name="battery_capacity[]" value="{{ battery.battery_capacity }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Battery Type</label>
                    <input type="text" class="form-control" name="battery_type[]" value="{{ battery.battery_type }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">No. of Cells/Bank</label>
                    <input type="number" class="form-control" name="no_of_cells_bank[]" value="{{ battery.no_of_cells_bank }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Date of Installation</label>
                    <input type="text" class="form-control" name="date_of_installation_battery[]" value="{{ battery.date_of_installation }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Load on Battery Bank</label>
                    <input type="number" step="any" class="form-control" name="load_on_battery_bank[]" value="{{ battery.load_on_battery_bank }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Practical Backup Time</label>
                    <input type="number" step="any" class="form-control" name="practical_backup_time[]" value="{{ battery.practical_backup_time }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Battery Installed (New/Used)</label>
                    <input type="text" class="form-control" name="battery_installed_new_or_used[]" value="{{ battery.battery_installed_new_or_used }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Battery Moved From</label>
                    <input type="text" class="form-control" name="battery_moved_from[]" value="{{ battery.battery_moved_from }}">
                </div>
                <button type="button" class="btn btn-danger btn-sm mt-2" onclick="removeField(this)">Remove Battery Bank</button>
            </div>
        {% endfor %}
    {% else %}
        <div class="dynamic-field">
            <div class="mb-3">
                <label class="form-label">Make of Battery</label>
                <input type="text" class="form-control" name="make_of_battery[]">
            </div>
            <div class="mb-3">
                <label class="form-label">Battery Capacity</label>
                <input type="number" step="any" class="form-control" name="battery_capacity[]">
            </div>
            <div class="mb-3">
                <label class="form-label">Battery Type</label>
                <input type="text" class="form-control" name="battery_type[]">
            </div>
            <div class="mb-3">
                <label class="form-label">No. of Cells/Bank</label>
                <input type="number" class="form-control" name="no_of_cells_bank[]">
            </div>
            <div class="mb-3">
                <label class="form-label">Date of Installation</label>
                <input type="text" class="form-control" name="date_of_installation_battery[]">
            </div>
            <div class="mb-3">
                <label class="form-label">Load on Battery Bank</label>
                <input type="number" step="any" class="form-control" name="load_on_battery_bank[]">
            </div>
            <div class="mb-3">
                <label class="form-label">Practical Backup Time</label>
                <input type="number" step="any" class="form-control" name="practical_backup_time[]">
            </div>
            <div class="mb-3">
                <label class="form-label">Battery Installed (New/Used)</label>
                <input type="text" class="form-control" name="battery_installed_new_or_used[]">
            </div>
            <div class="mb-3">
                <label class="form-label">Battery Moved From</label>
                <input type="text" class="form-control" name="battery_moved_from[]">
            </div>
            <button type="button" class="btn btn-danger btn-sm mt-2" onclick="removeField(this)">Remove Battery Bank</button>
        </div>
    {% endif %}
</div>
<button type="button" class="btn btn-secondary mt-2" onclick="addBatteryField()">Add Battery Bank</button>
<p>User Region: {% if session.get('region') %}{{ session['region'] }}{% else %}Unknown{% endif %}</p>
