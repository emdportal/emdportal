<div class="mb-3">
    <label for="sn" class="form-label">SN</label>
    <input type="number" class="form-control" id="sn" name="sn" value="{{ general.sn if general else '' }}" {% if general %}readonly{% endif %} required min="1">
    <div class="invalid-feedback">
        Please provide a valid Serial Number (must be a positive number).
    </div>
</div>
<div class="mb-3">
    <label for="region" class="form-label">Region</label>
    <input type="text" class="form-control" id="region" name="region" value="{{ session.get('region') if not general else general.region }}" {% if session.get('region') != 'All' %}readonly{% endif %} required>
</div>
<div class="mb-3">
    <label for="domain" class="form-label">Domain</label>
    <select class="form-control" id="domain" name="domain" required>
        <option value="" disabled {% if not general %}selected{% endif %}>Select Domain</option>
        <option value="Attock" {% if general and general.domain == 'Attock' %}selected{% endif %}>Attock</option>
        <option value="Pindi Gheb" {% if general and general.domain == 'Pindi Gheb' %}selected{% endif %}>Pindi Gheb</option>
        <option value="Taxila" {% if general and general.domain == 'Taxila' %}selected{% endif %}>Taxila</option>
        <option value="Rawat" {% if general and general.domain == 'Rawat' %}selected{% endif %}>Rawat</option>
        <option value="Murree" {% if general and general.domain == 'Murree' %}selected{% endif %}>Murree</option>
        <option value="Gujar Khan" {% if general and general.domain == 'Gujar Khan' %}selected{% endif %}>Gujar Khan</option>
        <option value="Jhelum" {% if general and general.domain == 'Jhelum' %}selected{% endif %}>Jhelum</option>
        <option value="Jhelum-MSAG" {% if general and general.domain == 'Jhelum-MSAG' %}selected{% endif %}>Jhelum-MSAG</option>
        <option value="Chakwal" {% if general and general.domain == 'Chakwal' %}selected{% endif %}>Chakwal</option>
        <option value="Talagang" {% if general and general.domain == 'Talagang' %}selected{% endif %}>Talagang</option>
        <option value="WLL Chakwal" {% if general and general.domain == 'WLL Chakwal' %}selected{% endif %}>WLL Chakwal</option>
        <option value="WLL Rawalpindi" {% if general and general.domain == 'WLL Rawalpindi' %}selected{% endif %}>WLL Rawalpindi</option>
    </select>
</div>
<div class="mb-3">
    <label for="exchange_name" class="form-label">Exchange Name</label>
    <input type="text" class="form-control" id="exchange_name" name="exchange_name" value="{{ general.exchange_name if general else '' }}">
</div>
<div class="mb-3">
    <label for="exchange_lic" class="form-label">Exchange LIC</label>
    <input type="text" class="form-control" id="exchange_lic" name="exchange_lic" value="{{ general.exchange_lic if general else '' }}">
</div>
<div class="mb-3">
    <label for="flc" class="form-label">FLC</label>
    <input type="text" class="form-control" id="flc" name="flc" value="{{ general.flc if general else '' }}">
</div>
<div class="mb-3">
    <label for="site_category" class="form-label">Site Category</label>
    <input type="text" class="form-control" id="site_category" name="site_category" value="{{ general.site_category if general else '' }}">
</div>
<div class="mb-3">
    <label for="nes_installed" class="form-label">NEs Installed</label>
    <textarea class="form-control" id="nes_installed" name="nes_installed">{{ general.nes_installed if general else '' }}</textarea>
</div>
<div class="mb-3">
    <label for="latitude" class="form-label">Latitude</label>
    <input type="number" step="any" class="form-control" id="latitude" name="latitude" value="{{ general.latitude if general else '' }}">
</div>
<div class="mb-3">
    <label for="longitude" class="form-label">Longitude</label>
    <input type="number" step="any" class="form-control" id="longitude" name="longitude" value="{{ general.longitude if general else '' }}">
</div>
<div class="mb-3">
    <label for="tower_available" class="form-label">Tower Available</label>
    <select class="form-control" id="tower_available" name="tower_available" onchange="toggleTowerFields()">
        <option value="No" {% if general and general.tower_available == 'No' %}selected{% endif %}>No</option>
        <option value="Yes" {% if general and general.tower_available == 'Yes' %}selected{% endif %}>Yes</option>
    </select>
</div>
<div id="tower_fields" style="display: {% if general and general.tower_available == 'Yes' %}block{% else %}none{% endif %};">
    <h4>Tower Details</h4>
    <div id="tower_container">
        {% if general %}
            {% for tower in general.towers %}
                <div class="dynamic-field">
                    <label class="form-label">Tower Type/Height</label>
                    <input type="text" class="form-control" name="tower_type_height[]" value="{{ tower.tower_type_height }}">
                    <button type="button" class="btn btn-danger btn-sm mt-2" onclick="removeField(this)">Remove</button>
                </div>
            {% endfor %}
        {% else %}
            <div class="dynamic-field">
                <label class="form-label">Tower Type/Height</label>
                <input type="text" class="form-control" name="tower_type_height[]">
                <button type="button" class="btn btn-danger btn-sm mt-2" onclick="removeField(this)">Remove</button>
            </div>
        {% endif %}
    </div>
    <button type="button" class="btn btn-secondary mt-2" onclick="addTowerField()">Add Tower</button>
</div>
<script>
// Client-side form validation for Bootstrap
(function () {
    'use strict';
    window.addEventListener('load', function () {
        var forms = document.getElementsByClassName('needs-validation');
        Array.prototype.filter.call(forms, function (form) {
            form.addEventListener('submit', function (event) {
                if (form.checkValidity() === false) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    }, false);
})();
</script>
