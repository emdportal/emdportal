<!DOCTYPE html>
<html>
<head>
    <title>Login - Exchange Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0e7ff, #ffffff);
        }
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .login-container .form-label {
            text-align: left;
            color: #1e3a8a;
        }
        .btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .alert {
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .logo {
            max-width: 150px; /* Adjust based on actual logo size */
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .login-container {
                margin: 20px;
                padding: 20px;
            }
            .logo {
                max-width: 120px; /* Smaller logo on mobile */
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="https://noss.ptcl.net.pk/assets/images/logo.png" alt="PTCL Logo" class="logo">
        <h2>Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
