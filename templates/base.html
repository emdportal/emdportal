<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Dashboard</title>
    <!-- Bootstrap CSS with integrity check -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Fallback to local Bootstrap CSS -->
    <script>
        var bootstrapCss = document.createElement('link');
        bootstrapCss.rel = 'stylesheet';
        bootstrapCss.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css';
        bootstrapCss.onerror = function() {
            var localCss = document.createElement('link');
            localCss.rel = 'stylesheet';
            localCss.href = '{{ url_for("static", filename="css/bootstrap.min.css") }}';
            document.head.appendChild(localCss);
        };
        document.head.appendChild(bootstrapCss);
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            background-color: #343a40;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            padding: 10px 20px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
        .navbar-top {
            margin-left: 250px;
            background-color: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 class="text-white text-center">Exchange Dashboard</h3>
        <a href="{{ url_for('index') }}" class="nav-link">Dashboard</a>
        <a href="{{ url_for('add') }}" class="nav-link">Add Exchange</a>
        <a href="{{ url_for('view_exchanges') }}" class="nav-link">View Exchanges</a>
        <a href="{{ url_for('export') }}" class="nav-link">Export Data</a>
        <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
    </div>

    <div class="navbar-top d-flex justify-content-between align-items-center">
        <span>Welcome, {{ username }}!</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>

    <div class="content">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">
                    {% for message in messages %}
                        {{ message }}<br>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS with integrity check -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <!-- Fallback to local Bootstrap JS -->
    <script>
        if (typeof bootstrap === 'undefined') {
            var localJs = document.createElement('script');
            localJs.src = '{{ url_for("static", filename="js/bootstrap.bundle.min.js") }}';
            document.body.appendChild(localJs);
        }
    </script>
</body>
</html>
