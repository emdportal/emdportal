{% extends "base.html" %}

{% block title %}
    View Exchanges
{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6 text-gray-800">View Exchanges</h1>
<div class="bg-white shadow rounded-lg overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">SN</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Region</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Exchange Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for exchange in exchanges %}
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ exchange.sn }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ exchange.region }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ exchange.site_name }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    <a href="{{ url_for('edit', sn=exchange.sn) }}" class="text-blue-600 hover:text-blue-800">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
